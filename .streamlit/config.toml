# calendarjam's CSS is written entirely for a light surface (white cards,
# #1a1a2e text). Without this, Streamlit follows the viewer's OS setting and
# a Mac in dark mode renders the app near-unreadable. Pin it to light.
[theme]
base = "light"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1a1a2e"
primaryColor = "#1c7a46"

[client]
toolbarMode = "minimal"
