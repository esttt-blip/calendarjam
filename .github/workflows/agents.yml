name: Agents

on:
  schedule:
    - cron: "0 11 */2 * *"  # ~7 AM ET every other day — stays within SerpApi free tier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install requests

      - name: Run agents
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python agents.py

      - name: Commit agents.json
        run: |
          git config user.name "calendarjam-bot"
          git config user.email "calendarjam@users.noreply.github.com"
          git add agents.json
          if ! git diff --staged --quiet; then
            git commit -m "agents: update $(date -u +%Y-%m-%d)"
            git push
          fi
