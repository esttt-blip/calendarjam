name: Daily sync

on:
  schedule:
    # 6:13 AM ET. Cron is UTC. Deliberately ONE scheduled run: sync.py now
    # guards against sending more than one email per ET day, so the manual
    # workflow_dispatch run still syncs the calendar without re-emailing.
    # (Winter this lands ~5:13 AM ET, which is fine for a morning brief.)
    - cron: "13 10 * * *"  # 6:13 AM EDT / 5:13 AM EST
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write  # to commit state files back

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          APP_URL: "https://calendarjam-ees.streamlit.app/"
        run: python sync.py

      - name: Commit state changes
        run: |
          git config user.name "calendarjam-bot"
          git config user.email "calendarjam@users.noreply.github.com"
          git add pending_events.json synced_events.json last_summary.json dashboard.json activity_log.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "sync: update state from $(date -u +%Y-%m-%d)"
            git push
          fi
